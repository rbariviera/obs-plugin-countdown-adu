<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Brilho para os dígitos digitais -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente dos botões (Tema Escuro OBS) -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c4046"/>
      <stop offset="100%" stop-color="#2c3036"/>
    </linearGradient>
  </defs>

  <!-- Janela Principal -->
  <rect x="0" y="0" width="540" height="330" rx="10" fill="#1b1c20" stroke="#33373e" stroke-width="2"/>

  <!-- Barra de Título OBS -->
  <path d="M0,10 Q0,0 10,0 L530,0 Q540,0 540,10 L540,36 L0,36 Z" fill="#24272c" />
  <text x="18" y="23" font-size="12" fill="#8e9297" font-weight="600">DOCK OBS • CONTROLE DE HORÁRIO</text>
  <circle cx="518" cy="18" r="5" fill="#444850" />

  <!-- TÍTULO SUPERIOR -->
  <text x="270" y="66" font-size="16" fill="#e1e4e8" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    Horário de início do culto
  </text>

  <!-- COLUNA ESQUERDA: "Hora" -->
  <text x="64" y="90" font-size="14" fill="#a0a6b2" font-weight="600" text-anchor="middle">Hora</text>

  <!-- Botão + (Hora) -->
  <g cursor="pointer">
    <rect x="36" y="100" width="56" height="50" rx="6" fill="url(#btn-grad)" stroke="#4d525c" stroke-width="1.5"/>
    <text x="64" y="133" font-size="28" fill="#ffffff" font-weight="bold" text-anchor="middle">+</text>
  </g>

  <!-- Botão - (Hora) -->
  <g cursor="pointer">
    <rect x="36" y="158" width="56" height="50" rx="6" fill="url(#btn-grad)" stroke="#4d525c" stroke-width="1.5"/>
    <text x="64" y="191" font-size="32" fill="#ffffff" font-weight="bold" text-anchor="middle">−</text>
  </g>

  <!-- PAINEL CENTRAL: Display Digital -->
  <rect x="110" y="96" width="320" height="116" rx="8" fill="#0d1117" stroke="#252930" stroke-width="2"/>
  
  <!-- Dígitos Inativos (Fundo LCD apagado) -->
  <text x="270" y="184" font-family="'Courier New', monospace" font-size="82" fill="#082b36" font-weight="900" text-anchor="middle" letter-spacing="4">
    88:88
  </text>

  <!-- Dígitos Ativos (20:00) -->
  <text x="270" y="184" font-family="'Courier New', monospace" font-size="82" fill="#00e5ff" font-weight="900" text-anchor="middle" letter-spacing="4" filter="url(#cyan-glow)">
    20:00
  </text>

  <!-- COLUNA DIREITA: "Min" -->
  <text x="476" y="90" font-size="14" fill="#a0a6b2" font-weight="600" text-anchor="middle">Min</text>

  <!-- Botão + (Minuto) -->
  <g cursor="pointer">
    <rect x="448" y="100" width="56" height="50" rx="6" fill="url(#btn-grad)" stroke="#4d525c" stroke-width="1.5"/>
    <text x="476" y="133" font-size="28" fill="#ffffff" font-weight="bold" text-anchor="middle">+</text>
  </g>

  <!-- Botão - (Minuto) -->
  <g cursor="pointer">
    <rect x="448" y="158" width="56" height="50" rx="6" fill="url(#btn-grad)" stroke="#4d525c" stroke-width="1.5"/>
    <text x="476" y="191" font-size="32" fill="#ffffff" font-weight="bold" text-anchor="middle">−</text>
  </g>

  <!-- BOTÕES INFERIORES -->
  <!-- Botão AGORA -->
  <g cursor="pointer">
    <rect x="36" y="240" width="112" height="52" rx="6" fill="url(#btn-grad)" stroke="#4d525c" stroke-width="1.5"/>
    <text x="92" y="272" font-size="15" fill="#f0f2f5" font-weight="700" text-anchor="middle">AGORA</text>
  </g>

  <!-- Botão 5 MIN -->
  <g cursor="pointer">
    <rect x="160" y="240" width="102" height="52" rx="6" fill="url(#btn-grad)" stroke="#4d525c" stroke-width="1.5"/>
    <text x="211" y="272" font-size="15" fill="#f0f2f5" font-weight="700" text-anchor="middle">5 MIN</text>
  </g>

  <!-- Botão 10 MIN -->
  <g cursor="pointer">
    <rect x="274" y="240" width="106" height="52" rx="6" fill="url(#btn-grad)" stroke="#4d525c" stroke-width="1.5"/>
    <text x="327" y="272" font-size="15" fill="#f0f2f5" font-weight="700" text-anchor="middle">10 MIN</text>
  </g>

  <!-- Botão AJUSTES (Catraca / Engrenagem Vetorial Nítida) -->
  <g cursor="pointer">
    <rect x="392" y="240" width="112" height="52" rx="6" fill="url(#btn-grad)" stroke="#4d525c" stroke-width="1.5"/>
    <svg x="434" y="252" width="28" height="28" viewBox="0 0 24 24">
      <path fill="#f0f2f5" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
    </svg>
  </g>
</svg>
